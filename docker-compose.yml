services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fraudlens
      POSTGRES_PASSWORD: fraudlens   # dev only. Never reuse this when deployed.
      POSTGRES_DB: fraudlens
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudlens"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: